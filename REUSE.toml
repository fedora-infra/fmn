version = 1
SPDX-PackageName = "fmn"
SPDX-PackageSupplier = "Fedora Infrastructure <admin@fedoraproject.org>"
SPDX-PackageDownloadLocation = "https://github.com/fedora-infra/fmn"

[[annotations]]
path = "changelog.d/**.**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Contributors to the Fedora Project"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ".github/**.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "Contributors to the Fedora Project"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["poetry.lock", "fmn-messages/poetry.lock", ".github/renovate.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "None, autogenerated"
SPDX-License-Identifier = "MIT"
